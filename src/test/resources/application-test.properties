# Test profile: self-contained in-memory H2 in MySQL compatibility mode.
# CI additionally runs the same tests against real MySQL by overriding
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD / _DRIVER_CLASS_NAME via environment variables.
spring.datasource.url=jdbc:h2:mem:workpulse;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false
workpulse.registration.enabled=true
workpulse.timezone=Asia/Kolkata
workpulse.bootstrap-admin.email=
workpulse.bootstrap-admin.password=
logging.level.root=WARN
logging.level.com.workpulse=WARN
