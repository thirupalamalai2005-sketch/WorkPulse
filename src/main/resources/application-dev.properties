# Local development profile:  --spring.profiles.active=dev
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workpulse_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
workpulse.registration.enabled=true
# Creates sample departments/employees (dev ONLY - never enable in production)
workpulse.dev-seed.enabled=true
logging.level.com.workpulse=DEBUG
