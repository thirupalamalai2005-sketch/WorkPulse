<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — WorkPulse</title>
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body>
  <div class="page-header">
    <div class="page-header-left">
      <h2 class="page-title">My Profile</h2>
      <p class="page-subtitle">Your details and password.</p>
    </div>
    <div class="page-header-actions"></div>
  </div>
  <div class="alert alert-error" id="page-error" role="alert" hidden></div>

  <div class="dashboard-grid">
    <div class="card">
      <div class="card-header"><h3 class="card-title">Profile</h3></div>
      <div class="card-body">
        <dl id="profile-facts" class="form-group"></dl>
        <form id="profile-form" novalidate>
          <div class="alert alert-error" id="profile-error" role="alert" hidden></div>
          <div class="form-group"><label class="form-label" for="p-name">Full name</label><input class="form-control" id="p-name" maxlength="50" required /></div>
          <div class="form-group"><label class="form-label" for="p-phone">Phone</label><input class="form-control" id="p-phone" maxlength="20" autocomplete="tel" /></div>
          <button class="btn btn-primary" type="submit">Save profile</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3 class="card-title">Change password</h3></div>
      <div class="card-body">
        <form id="pw-form" novalidate>
          <div class="alert alert-error" id="pw-error" role="alert" hidden></div>
          <div class="form-group"><label class="form-label" for="pw-current">Current password</label><input type="password" class="form-control" id="pw-current" autocomplete="current-password" required /></div>
          <div class="form-group"><label class="form-label" for="pw-new">New password</label><input type="password" class="form-control" id="pw-new" autocomplete="new-password" required />
            <p class="form-hint">12–128 characters with upper-case, lower-case, digit and special character.</p></div>
          <div class="form-group"><label class="form-label" for="pw-confirm">Confirm new password</label><input type="password" class="form-control" id="pw-confirm" autocomplete="new-password" required /></div>
          <button class="btn btn-primary" type="submit">Change password</button>
          <p class="form-hint">You will be signed out everywhere after changing your password.</p>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/profile.js"></script>
</body>
</html>
