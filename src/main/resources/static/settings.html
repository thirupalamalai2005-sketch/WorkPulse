<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar & Policies — WorkPulse</title>
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body>
  <div class="page-header">
    <div class="page-header-left">
      <h2 class="page-title">Calendar & Policies</h2>
      <p class="page-subtitle">Holidays, working schedule and leave entitlements.</p>
    </div>
    <div class="page-header-actions"></div>
  </div>
  <div class="alert alert-error" id="page-error" role="alert" hidden></div>

  <div class="card">
    <div class="card-header"><h3 class="card-title">Work schedule</h3><button class="btn btn-sm btn-secondary" id="btn-sched" hidden>Edit</button></div>
    <div class="card-body" id="sched-view"></div>
  </div>
  <div class="card" style="margin-top:var(--space-5)">
    <div class="card-header"><h3 class="card-title">Leave types</h3></div>
    <div class="table-wrapper"><table class="table"><thead><tr><th>Type</th><th>Yearly days</th><th>Back-dating</th><th>Status</th><th>Actions</th></tr></thead><tbody id="lt-body"></tbody></table></div>
  </div>
  <div class="card" style="margin-top:var(--space-5)">
    <div class="card-header"><h3 class="card-title">Company holidays</h3>
      <div style="display:flex;gap:8px;align-items:center"><select class="form-control table-filter" id="h-year" aria-label="Year"></select>
      <button class="btn btn-sm btn-primary" id="btn-holiday" hidden>Add holiday</button></div></div>
    <div class="table-wrapper"><table class="table"><thead><tr><th>Date</th><th>Holiday</th><th>Actions</th></tr></thead><tbody id="hol-body"></tbody></table></div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/settings.js"></script>
</body>
</html>
