<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — WorkPulse</title>
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body>
  <div class="page-header">
    <div class="page-header-left">
      <h2 class="page-title">Reports</h2>
      <p class="page-subtitle">Filter attendance and leave data and export it as CSV.</p>
    </div>
    <div class="page-header-actions"><button class="btn btn-primary" id="btn-csv">Download CSV</button></div>
  </div>
  <div class="alert alert-error" id="page-error" role="alert" hidden></div>

  <div class="card">
    <div class="table-toolbar"><div class="table-toolbar-left">
      <select class="form-control table-filter" id="r-type" aria-label="Report type"><option value="attendance">Attendance</option><option value="leaves">Leave</option></select>
      <input type="date" class="form-control table-filter" id="r-from" aria-label="From date" />
      <input type="date" class="form-control table-filter" id="r-to" aria-label="To date" />
      <select class="form-control table-filter" id="r-dept" aria-label="Department"></select>
      <input type="search" class="form-control table-filter" id="r-q" placeholder="Employee name or code" aria-label="Employee" />
      <select class="form-control table-filter" id="r-status" aria-label="Leave status" hidden>
        <option value="">All statuses</option><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="CANCELLED">Cancelled</option>
      </select>
      <button class="btn btn-primary btn-sm" id="r-apply" type="button">Run report</button>
    </div></div>
    <div class="table-wrapper"><table class="table"><thead id="rep-head"></thead><tbody id="rep-body"></tbody></table></div>
    <div class="pagination" id="rep-pager"></div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/reports.js"></script>
</body>
</html>
