<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — WorkPulse</title>
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body>
  <div class="page-header">
    <div class="page-header-left">
      <h2 class="page-title">Notifications</h2>
      <p class="page-subtitle">Stored on the server, so they persist across devices.</p>
    </div>
    <div class="page-header-actions"><button class="btn btn-secondary" id="btn-all">Mark all as read</button></div>
  </div>
  <div class="alert alert-error" id="page-error" role="alert" hidden></div>

  <div class="card">
    <div class="table-toolbar"><div class="table-toolbar-left">
      <select class="form-control table-filter" id="n-filter" aria-label="Filter"><option value="">All</option><option value="unread">Unread only</option></select>
    </div></div>
    <div id="notif-list"></div>
    <div class="pagination" id="notif-pager"></div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/notifications.js"></script>
</body>
</html>
