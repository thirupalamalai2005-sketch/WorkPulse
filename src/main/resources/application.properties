# =====================================================================
# WorkPulse - base / production-safe configuration
# Secrets are NEVER stored here. Provide them as environment variables
# (see .env.example). Use  --spring.profiles.active=dev  for local work.
# =====================================================================
spring.application.name=workpulse
server.port=${PORT:8080}

# ---- Database (MySQL 8). DB_USERNAME / DB_PASSWORD have no defaults on purpose.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workpulse_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Schema is owned by Flyway (src/main/resources/db/migration). Hibernate never changes it.
spring.flyway.enabled=true
# Lets an existing database that was created by the old ddl-auto=update setup adopt Flyway:
# the existing "users" table is treated as version 1, later migrations are applied on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true whenever the app is served over HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Error responses never leak internals
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Health / monitoring: only the health endpoint is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---- Login throttling (in-memory, per e-mail)
security.login.rate-limit.max-attempts=5
security.login.rate-limit.lockout-duration-seconds=300

# ---- WorkPulse settings
# IANA zone used to decide "today", late arrivals and working days.
workpulse.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Public self-registration is OFF by default for a company HR system.
workpulse.registration.enabled=${REGISTRATION_ENABLED:false}
# First administrator is provisioned ONLY when no ADMIN exists AND both values are set.
workpulse.bootstrap-admin.email=${WORKPULSE_ADMIN_EMAIL:}
workpulse.bootstrap-admin.username=${WORKPULSE_ADMIN_NAME:System Administrator}
workpulse.bootstrap-admin.password=${WORKPULSE_ADMIN_PASSWORD:}
workpulse.dev-seed.enabled=false

# ---- Logging (production)
logging.level.root=INFO
logging.level.com.workpulse=INFO
logging.level.org.springframework.security=WARN
