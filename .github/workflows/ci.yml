name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-h2:
    name: Build + tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Build and run all tests
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check frontend scripts
        run: for f in src/main/resources/static/assets/js/*.js; do node --check "$f"; done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-h2
          path: target/surefire-reports

  test-mysql:
    name: Migrations + tests on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: workpulse_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # Environment variables override application-test.properties, so the SAME tests run on real MySQL
      # and the Flyway migrations are executed against it from a clean database.
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/workpulse_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-root-password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Build and run all tests against MySQL
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-mysql
          path: target/surefire-reports
